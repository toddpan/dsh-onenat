# dsh-onenat bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; install with
# `dsh plugin --profile web add https://github.com/toddpan/dsh-onenat`
# (or the npm spec once published).
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (管理 API / onenat_agent 工具 / agent pre-step), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI（设置页 + @ 输入触发源 + 状态行）.
- insert:
    - id: dsh-onenat
      name: 'dsh-onenat'
